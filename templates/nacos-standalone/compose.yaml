services:
    nacos1:
        environment:
            MODE: standalone
            NACOS_AUTH_ENABLE: "true"
            NACOS_AUTH_IDENTITY_KEY: ${NACOS_IDENTITY_KEY}
            NACOS_AUTH_IDENTITY_VALUE: ${NACOS_IDENTITY_VALUE:?请填写节点身份密钥}
            NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?请填写认证令牌}
            NACOS_APPLICATION_PORT: "8848"
        healthcheck:
            interval: 10s
            retries: 18
            start_period: 30s
            test:
                - CMD-SHELL
                - curl -fsS --max-time 3 http://127.0.0.1:8848/nacos/v3/admin/core/state/readiness | grep -q '"data":"ok"' && curl -fsS --max-time 3 http://127.0.0.1:8080/ >/dev/null
            timeout: 5s
        hostname: nacos1
        image: ${NACOS_IMAGE:?请填写 Nacos 镜像}
        ports:
            - ${NACOS_PORT}:8848
            - ${NACOS_GRPC_PORT}:9848
            - ${NACOS_CONSOLE_PORT}:8080
        restart: unless-stopped
        volumes:
            - nacos1-data:/home/nacos/data
            - nacos1-logs:/home/nacos/logs
volumes:
    nacos1-data: {}
    nacos1-logs: {}
