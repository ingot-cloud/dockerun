configs:
    nacos-schema:
        file: ./configs/nacos-mysql.sql
services:
    mysql:
        configs:
            - source: nacos-schema
              target: /docker-entrypoint-initdb.d/01-nacos.sql
        environment:
            MYSQL_DATABASE: nacos
            MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请填写 Nacos 数据库密码}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请填写管理员密码}
            MYSQL_USER: nacos
        healthcheck:
            interval: 5s
            retries: 30
            start_period: 30s
            test:
                - CMD-SHELL
                - MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -uroot -Nse "SELECT 1"
            timeout: 5s
        image: ${MYSQL_IMAGE:?请填写 MySQL 镜像}
        restart: unless-stopped
        volumes:
            - mysql-data:/var/lib/mysql
    nacos1:
        depends_on:
            mysql:
                condition: service_healthy
        environment:
            MODE: cluster
            MYSQL_SERVICE_DB_NAME: nacos
            MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
            MYSQL_SERVICE_HOST: mysql
            MYSQL_SERVICE_PASSWORD: ${MYSQL_PASSWORD:?请填写数据库密码}
            MYSQL_SERVICE_PORT: "3306"
            MYSQL_SERVICE_USER: nacos
            NACOS_AUTH_ENABLE: "true"
            NACOS_AUTH_IDENTITY_KEY: ${NACOS_IDENTITY_KEY}
            NACOS_AUTH_IDENTITY_VALUE: ${NACOS_IDENTITY_VALUE:?请填写节点身份密钥}
            NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?请填写认证令牌}
            NACOS_APPLICATION_PORT: "8848"
            NACOS_SERVERS: nacos1:8848 nacos2:8848 nacos3:8848
            PREFER_HOST_MODE: hostname
            SPRING_DATASOURCE_PLATFORM: mysql
        healthcheck:
            interval: 10s
            retries: 18
            start_period: 30s
            test:
                - CMD-SHELL
                - curl -fsS --max-time 3 http://127.0.0.1:8848/nacos/v3/admin/core/state/readiness | grep -q '"data":"ok"' && curl -fsS --max-time 3 http://127.0.0.1:8080/ >/dev/null
            timeout: 5s
        hostname: nacos1
        image: ${NACOS_IMAGE:?请填写 Nacos 镜像}
        ports:
            - ${NACOS_PORT}:8848
            - ${NACOS_GRPC_PORT}:9848
            - ${NACOS_CONSOLE_PORT}:8080
        restart: unless-stopped
        volumes:
            - nacos1-data:/home/nacos/data
            - nacos1-logs:/home/nacos/logs
    nacos2:
        depends_on:
            mysql:
                condition: service_healthy
        environment:
            MODE: cluster
            MYSQL_SERVICE_DB_NAME: nacos
            MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
            MYSQL_SERVICE_HOST: mysql
            MYSQL_SERVICE_PASSWORD: ${MYSQL_PASSWORD:?请填写数据库密码}
            MYSQL_SERVICE_PORT: "3306"
            MYSQL_SERVICE_USER: nacos
            NACOS_AUTH_ENABLE: "true"
            NACOS_AUTH_IDENTITY_KEY: ${NACOS_IDENTITY_KEY}
            NACOS_AUTH_IDENTITY_VALUE: ${NACOS_IDENTITY_VALUE:?请填写节点身份密钥}
            NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?请填写认证令牌}
            NACOS_APPLICATION_PORT: "8848"
            NACOS_SERVERS: nacos1:8848 nacos2:8848 nacos3:8848
            PREFER_HOST_MODE: hostname
            SPRING_DATASOURCE_PLATFORM: mysql
        healthcheck:
            interval: 10s
            retries: 18
            start_period: 30s
            test:
                - CMD-SHELL
                - curl -fsS --max-time 3 http://127.0.0.1:8848/nacos/v3/admin/core/state/readiness | grep -q '"data":"ok"' && curl -fsS --max-time 3 http://127.0.0.1:8080/ >/dev/null
            timeout: 5s
        hostname: nacos2
        image: ${NACOS_IMAGE:?请填写 Nacos 镜像}
        restart: unless-stopped
        volumes:
            - nacos2-data:/home/nacos/data
            - nacos2-logs:/home/nacos/logs
    nacos3:
        depends_on:
            mysql:
                condition: service_healthy
        environment:
            MODE: cluster
            MYSQL_SERVICE_DB_NAME: nacos
            MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
            MYSQL_SERVICE_HOST: mysql
            MYSQL_SERVICE_PASSWORD: ${MYSQL_PASSWORD:?请填写数据库密码}
            MYSQL_SERVICE_PORT: "3306"
            MYSQL_SERVICE_USER: nacos
            NACOS_AUTH_ENABLE: "true"
            NACOS_AUTH_IDENTITY_KEY: ${NACOS_IDENTITY_KEY}
            NACOS_AUTH_IDENTITY_VALUE: ${NACOS_IDENTITY_VALUE:?请填写节点身份密钥}
            NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?请填写认证令牌}
            NACOS_APPLICATION_PORT: "8848"
            NACOS_SERVERS: nacos1:8848 nacos2:8848 nacos3:8848
            PREFER_HOST_MODE: hostname
