  akhq:
    image: ${AKHQ_IMAGE:?请填写此环境的参数}
    restart: unless-stopped
    ports:
    - ${AKHQ_PORT}:8080
    environment:
      AKHQ_CONFIGURATION: "akhq:\n  connections:\n    local:\n      properties:\n        bootstrap.servers: \"kafka-broker-1:29092,kafka-broker-2:29092,kafka-broker-3:29092\"\
        \n"
    depends_on:
      kafka-broker-1:
        condition: service_healthy
      kafka-broker-2:
        condition: service_healthy
      kafka-broker-3:
        condition: service_healthy
volumes:
  kafka1-data: {}
  kafka2-data: {}
  kafka3-data: {}
