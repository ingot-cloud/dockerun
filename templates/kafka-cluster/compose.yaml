services:
  kafka-broker-1:
    image: ${KAFKA_IMAGE:?请填写此环境的参数}
    restart: unless-stopped
    ports:
    - ${BROKER1_PORT}:9092
    environment:
      CLUSTER_ID: ${CLUSTER_ID:?请填写此环境的参数}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: '1'
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker-1:9093,2@kafka-broker-2:9093,3@kafka-broker-3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-broker-1:29092,EXTERNAL://${BROKER1_HOST:?请填写此环境的参数}:${BROKER1_PORT}
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '3'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '3'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '2'
      KAFKA_DEFAULT_REPLICATION_FACTOR: '3'
      KAFKA_MIN_INSYNC_REPLICAS: '2'
      KAFKA_NUM_PARTITIONS: '12'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: '72'
      KAFKA_LOG_SEGMENT_BYTES: '1073741824'
      KAFKA_HEAP_OPTS: ${BROKER_HEAP_OPTS}
      KAFKA_LOG_RETENTION_BYTES: '150000000000'
      KAFKA_LOG_CLEANER_ENABLE: 'true'
      KAFKA_NUM_NETWORK_THREADS: '8'
      KAFKA_NUM_IO_THREADS: '16'
      KAFKA_SOCKET_SEND_BUFFER_BYTES: '102400'
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: '102400'
      KAFKA_SOCKET_REQUEST_MAX_BYTES: '104857600'
      KAFKA_JVM_PERFORMANCE_OPTS: '-server -XX:+UseG1GC -XX:MaxGCPauseMillis=20'
    volumes:
    - kafka1-data:/var/lib/kafka/data
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 60s
