services:
  registry:
    image: ${REGISTRY_IMAGE:?请填写此环境的参数}
    restart: unless-stopped
    ports:
    - ${REGISTRY_PORT}:5000
    environment:
      OTEL_TRACES_EXPORTER: none
    configs:
    - source: registry-config
      target: /etc/distribution/config.yml
    volumes:
    - registry-data:/var/lib/registry
    - ${REGISTRY_AUTH_DIR:?请填写此环境的参数}:/auth:ro
configs:
  registry-config:
    file: ./configs/registry.yml
volumes:
  registry-data: {}
