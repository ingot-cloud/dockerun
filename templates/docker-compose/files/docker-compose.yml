version: '3.8'

services:
  web:
    image: nginx:latest
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
    restart: unless-stopped
    
  app:
    image: node:lts-alpine
    working_dir: /app
    volumes:
      - ./app:/app
    command: sh -c "npm install && npm start"
    restart: unless-stopped

