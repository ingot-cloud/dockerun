# Redis 缓存服务器配置

CONTAINER_NAME="redis-cache"
IMAGE_NAME="redis:7-alpine"
RESTART_POLICY="unless-stopped"
NETWORK_NAME="backend-net"

# 端口映射
PORTS="6379:6379"

# 数据持久化
NAMED_VOLUMES="
redis-data:/data
"

# 自定义配置文件
VOLUMES="
/data/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
"

# 环境变量
ENV_VARS="
TZ=Asia/Shanghai
"

# 资源限制
CPU_LIMIT="1.0"
MEMORY_LIMIT="512m"

# 健康检查
HEALTH_CHECK_ENABLED="true"
HEALTH_CHECK_CMD="redis-cli ping || exit 1"
HEALTH_CHECK_INTERVAL="10s"
HEALTH_CHECK_TIMEOUT="3s"
HEALTH_CHECK_RETRIES="3"

# 启动命令（使用配置文件）
EXTRA_DOCKER_ARGS="redis-server /usr/local/etc/redis/redis.conf"

# 日志配置
LOG_DRIVER="json-file"
LOG_MAX_SIZE="10m"
LOG_MAX_FILE="3"

