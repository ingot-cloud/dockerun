name: dockerun-test-2222
services:
  dockerun:
    image: dockerun:test-2222
    build:
      context: ..
      dockerfile: Dockerfile
    restart: "no"
    ports:
      - "127.0.0.1:18081:8080"
    environment:
      PUBLIC_URL: http://127.0.0.1:18081
      DATA_DIR: /var/lib/dockerun-test-2222
      DATABASE_TYPE: sqlite
      GIN_MODE: release
      SERVER_ADDR: ":8080"
      TEMPLATE_DIR: /app/templates
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/dockerun-test-2222:/var/lib/dockerun-test-2222
